<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Marshmallow DJ Control</title>
    <style>
        :root {
            --bg-color: #121212;
            --btn-som: #3498db;
            --btn-som-tocando: #f39c12;
            /* Cor amarela/laranja para indicar que está ativo */
            --btn-mic-off: #e74c3c;
            --btn-mic-on: #2ecc71;
            --text: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            margin-top: 0;
        }

        .sound-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            flex-grow: 1;
            margin-bottom: 20px;
        }

        button {
            border: none;
            border-radius: 12px;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--text);
            cursor: pointer;
            transition: all 0.2s;
            touch-action: manipulation;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 10px;
        }

        button:active {
            transform: scale(0.95);
            filter: brightness(0.8);
        }

        .btn-som {
            background-color: var(--btn-som);
        }

        /* Efeito de brilho e mudança de cor quando o botão está tocando */
        .btn-som.tocando {
            background-color: var(--btn-som-tocando);
            box-shadow: 0 0 15px rgba(243, 156, 18, 0.6);
            border: 2px solid #fff;
        }

        .btn-mic {
            background-color: var(--btn-mic-off);
            padding: 25px;
            font-size: 1.5rem;
            width: 100%;
            height: 100px;
        }

        .btn-mic.ativo {
            background-color: var(--btn-mic-on);
        }
    </style>
</head>

<body>

    <h1> Marshmallow DJ Control</h1>

    <div class="sound-grid" id="sound-grid">
        <!-- Botões gerados via JavaScript -->
    </div>

    <button id="btn-mic" class="btn-mic">Desligado (Toque para Falar)</button>

    <script>
        // 1. CONFIGURAÇÃO DOS SONS
        const sons = [
            { id: 'apito', label: 'Apito do Juiz', arquivo: 'apito.mp3' },
            { id: 'gol', label: '⚽ GOL!', arquivo: 'gol.mp3' },
            { id: 'torcida', label: 'Grito Torcida', arquivo: 'torcida.mp3' },
            { id: 'falta', label: 'Falta / Erro', arquivo: 'falta.mp3' }
        ];

        // 2. GERAR BOTÕES E LÓGICA DE REPRODUÇÃO
        const grid = document.getElementById('sound-grid');

        // Variáveis globais para rastrear o que está tocando
        let audioAtual = null;
        let botaoAtivo = null;

        sons.forEach(som => {
            const btn = document.createElement('button');
            btn.className = 'btn-som';
            btn.innerText = som.label;

            const audioObj = new Audio(som.arquivo);

            // Quando o áudio terminar naturalmente, devolve o botão ao estado normal
            audioObj.addEventListener('ended', () => {
                btn.classList.remove('tocando');
                btn.innerText = som.label;
                audioAtual = null;
                botaoAtivo = null;
            });

            btn.onclick = () => {
                // REGRA: Se já tem um áudio tocando na mesa
                if (audioAtual) {
                    if (botaoAtivo === btn) {
                        // O usuário apertou o MESMO botão que está tocando: Pausa e Reseta
                        audioAtual.pause();
                        audioAtual.currentTime = 0; // Volta para o segundo zero
                        btn.classList.remove('tocando');
                        btn.innerText = som.label;
                        audioAtual = null;
                        botaoAtivo = null;
                    } else {
                        // O usuário apertou OUTRO botão: Ignora a ação
                        console.log("Aguarde o som atual terminar para tocar outro.");
                    }
                    return; // Interrompe a execução do clique aqui
                }

                // REGRA: Se a mesa está em silêncio, toca o áudio deste botão
                audioAtual = audioObj;
                botaoAtivo = btn;

                // Feedback visual: Adiciona a classe CSS e muda o texto
                btn.classList.add('tocando');
                btn.innerText = "⏹️ Parar";

                audioAtual.play().catch(erro => {
                    console.error("Erro ao tocar:", erro);
                    // Se der erro (ex: arquivo não encontrado), reseta a tela
                    btn.classList.remove('tocando');
                    btn.innerText = som.label;
                    audioAtual = null;
                    botaoAtivo = null;
                });
            };
            grid.appendChild(btn);
        });

        // 3. LÓGICA DO MICROFONE (Web Audio API)
        const btnMic = document.getElementById('btn-mic');
        let audioContext;
        let mediaStream;
        let sourceNode;
        let micAtivo = false;

        btnMic.onclick = async () => {
            if (micAtivo) {
                mediaStream.getTracks().forEach(track => track.stop());
                audioContext.close();

                micAtivo = false;
                btnMic.classList.remove('ativo');
                btnMic.innerText = 'Desligado (Toque para Falar)';
            } else {
                try {
                    mediaStream = await navigator.mediaDevices.getUserMedia({
                        audio: {
                            echoCancellation: false,
                            noiseSuppression: false,
                            autoGainControl: false
                        }
                    });

                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    sourceNode = audioContext.createMediaStreamSource(mediaStream);
                    sourceNode.connect(audioContext.destination);

                    micAtivo = true;
                    btnMic.classList.add('ativo');
                    btnMic.innerText = '🔴 AO VIVO (Toque para Mutar)';

                } catch (erro) {
                    console.error("Erro ao acessar microfone:", erro);
                    alert("Não foi possível acessar o microfone.");
                }
            }
        };
    </script>
</body>

</html>
