<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Marshmallow DJ Control</title>
    <style>
        :root {
            --bg-color: #121212;
            --btn-mic-off: #e74c3c;
            --btn-mic-on: #2ecc71;
            --text: #ffffff;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }

        h1 { text-align: center; margin-top: 0; }

        .sound-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            flex-grow: 1;
            margin-bottom: 20px;
        }

        button {
            border: 2px solid transparent; 
            border-radius: 12px;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--text);
            cursor: pointer;
            transition: all 0.2s;
            touch-action: manipulation;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        button:active { transform: scale(0.95); filter: brightness(0.8); }

        .btn-som.tocando { 
            border: 2px solid #ffffff;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
            filter: brightness(1.2);
        }

        .btn-mic {
            background-color: var(--btn-mic-off);
            padding: 25px;
            font-size: 1.5rem;
            width: 100%;
            height: 100px;
            margin-top: auto;
        }

        .btn-mic.ativo { background-color: var(--btn-mic-on); }
    </style>
</head>
<body>

    <h1>🎙️ Marshmallow DJ Control</h1>

    <div class="sound-grid" id="sound-grid">
        <!-- Botões gerados via JavaScript -->
    </div>

    <button id="btn-mic" class="btn-mic">Desligado (Toque para Falar)</button>

    <script>
        const pastaSons = 'sons/'; 

        // 1. CONFIGURAÇÃO DOS SONS E CORES ATUALIZADA
        const sons = [
            { id: 'gol_brasil', label: 'Gol Brasil', arquivo: 'gol brasil.mp3', cor: '#f1c40f' },
            { id: 'gol_casca_grossa', label: 'Gol Casca Grossa', arquivo: 'gol casca grossa.mp3', cor: '#e74c3c' },
            { id: 'gol_do_mago', label: 'Gol do Mago', arquivo: 'gol do mago.mp3', cor: '#8e44ad' },
            { id: 'gol_empurra', label: 'Gol Empurra', arquivo: 'gol empurra.mp3', cor: '#34495e' },
            { id: 'gol_fox', label: 'Gol Fox', arquivo: 'gol fox.mp3', cor: '#3498db' },
            { id: 'gol_tropa', label: 'Gol Tropa', arquivo: 'gol tropa.mp3', cor: '#2c3e50' },
            { id: 'gol_ugoslavia', label: 'Gol Ugoslávia', arquivo: 'gol ugoslavia.mp3', cor: '#c0392b' },
            { id: 'hino_champions', label: 'Hino Champions', arquivo: 'hino champions.mp3', cor: '#9b59b6' },
            { id: 'tropa_empurra', label: 'Tropa do Empurra', arquivo: 'tropa do empurra.mp3', cor: '#e67e22' },
            { id: 'wonderwall', label: 'Wonderwall Live', arquivo: 'wonderwall live.mp3', cor: '#1abc9c' }
        ];

        // 2. GERAR BOTÕES E LÓGICA DE REPRODUÇÃO
        const grid = document.getElementById('sound-grid');
        
        let audioAtual = null;
        let botaoAtivo = null;
        
        sons.forEach(som => {
            const btn = document.createElement('button');
            btn.className = 'btn-som';
            btn.innerText = som.label;
            
            // Guarda o nome original no botão para restaurar mais tarde
            btn.dataset.label = som.label; 
            
            btn.style.backgroundColor = som.cor;
            
            const caminhoCompleto = pastaSons + som.arquivo;
            const audioObj = new Audio(caminhoCompleto);
            
            audioObj.addEventListener('ended', () => {
                btn.classList.remove('tocando');
                btn.innerText = btn.dataset.label;
                audioAtual = null;
                botaoAtivo = null;
            });
            
            btn.onclick = () => {
                // SITUAÇÃO 1: Clicou no MESMO botão que já está tocando (Pausa e desliga)
                if (audioAtual && botaoAtivo === btn) {
                    audioAtual.pause();
                    audioAtual.currentTime = 0; 
                    btn.classList.remove('tocando');
                    btn.innerText = btn.dataset.label;
                    audioAtual = null;
                    botaoAtivo = null;
                    return; 
                }

                // SITUAÇÃO 2: Clicou num botão DIFERENTE enquanto outro tocava (Corta o antigo)
                if (audioAtual && botaoAtivo !== btn) {
                    audioAtual.pause();
                    audioAtual.currentTime = 0;
                    botaoAtivo.classList.remove('tocando');
                    botaoAtivo.innerText = botaoAtivo.dataset.label; 
                }

                // Inicia o áudio do botão clicado
                audioAtual = audioObj;
                botaoAtivo = btn;
                
                btn.classList.add('tocando');
                btn.innerText = "⏹️ Parar"; 
                
                audioAtual.play().catch(erro => {
                    console.error("Erro ao tocar:", erro);
                    btn.classList.remove('tocando');
                    btn.innerText = btn.dataset.label;
                    audioAtual = null;
                    botaoAtivo = null;
                });
            };
            grid.appendChild(btn);
        });

        // 3. LÓGICA DO MICROFONE
        const btnMic = document.getElementById('btn-mic');
        let audioContext;
        let mediaStream;
        let sourceNode;
        let micAtivo = false;

        btnMic.onclick = async () => {
            if (micAtivo) {
                mediaStream.getTracks().forEach(track => track.stop());
                audioContext.close();
                
                micAtivo = false;
                btnMic.classList.remove('ativo');
                btnMic.innerText = 'Desligado (Toque para Falar)';
            } else {
                try {
                    mediaStream = await navigator.mediaDevices.getUserMedia({ 
                        audio: {
                            echoCancellation: false, 
                            noiseSuppression: false,
                            autoGainControl: false
                        } 
                    });

                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    sourceNode = audioContext.createMediaStreamSource(mediaStream);
                    sourceNode.connect(audioContext.destination);

                    micAtivo = true;
                    btnMic.classList.add('ativo');
                    btnMic.innerText = '🔴 AO VIVO (Toque para Mutar)';

                } catch (erro) {
                    console.error("Erro ao acessar microfone:", erro);
                    alert("Não foi possível acessar o microfone.");
                }
            }
        };
    </script>
</body>
</html>
